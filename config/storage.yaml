# Long-term storage: one Apache Iceberg table per dataset, in object storage,
# queried through Trino. Schema and validation rules: core/config.py
version: "1.0.0"

tables:
  - dataset: telemetry
    table: raw.telemetry  # <namespace>.<table> in the Iceberg catalog
    partition_by: day     # Iceberg transform on the dataset's time column: hour, day or month

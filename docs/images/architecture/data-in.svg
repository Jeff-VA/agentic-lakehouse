<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1252 504" width="1252" height="504" role="img" aria-label="Events reach Kafka from your producers, or from live feeds that ingest reads. Processors read one dataset's topic and publish another dataset. Pinot ingests every topic live; a flush appends events to Iceberg every 5 minutes, exactly once, and records how far Iceberg is complete by event time. From Iceberg, rollups build gold tables and steps write tables in SQL or Python, both behind quality gates; the drift agent proposes config patches for new columns.">
  <title>Events reach Kafka from your producers, or from live feeds that ingest reads. Processors read one dataset's topic and publish another dataset. Pinot ingests every topic live; a flush appends events to Iceberg every 5 minutes, exactly once, and records how far Iceberg is complete by event time. From Iceberg, rollups build gold tables and steps write tables in SQL or Python, both behind quality gates; the drift agent proposes config patches for new columns.</title>
  <style>
  svg {
    --fg: #17202a; --muted: #5a6572; --line: #c3cbd4; --surface: #ffffff;
    --rt: #c05f10; --rt-soft: #fdf0e4; --hist: #2461a6; --hist-soft: #e7eff9;
    --ai: #7550c0; --ai-soft: #f0ebfa; --both: #0d7a6b;
    color: var(--fg);
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --fg: #e5eaef; --muted: #95a1ad; --line: #3a4552; --surface: #161d24;
      --rt: #f09650; --rt-soft: #2b1f15; --hist: #6ba6ea; --hist-soft: #15212e;
      --ai: #b195f0; --ai-soft: #221b32; --both: #4fc4b1;
    }
  }
  .card { fill: var(--surface); stroke: var(--line); }
  .box { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
  .box.rt { fill: var(--rt-soft); stroke: var(--rt); }
  .box.hist { fill: var(--hist-soft); stroke: var(--hist); }
  .box.ai { fill: var(--ai-soft); stroke: var(--ai); }
  .title { fill: var(--fg); font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  .title.file { font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .sub, .label { fill: var(--muted); font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  .edge { stroke: currentColor; stroke-width: 1.5; fill: none; }
  </style>
  <rect class="card" x="0.5" y="0.5" width="1251" height="503" rx="12"/>
  <g transform="translate(16 16)">
          <defs>
            <marker id="arrow-in" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
            </marker>
          </defs>
          <!-- edges -->
          <path class="edge" d="M200 176 H270" marker-end="url(#arrow-in)"/>
          <text class="label" x="235" y="167" text-anchor="middle">events</text>
          <path class="edge" d="M200 296 H270" marker-end="url(#arrow-in)"/>
          <text class="label" x="235" y="287" text-anchor="middle">events</text>
          <path class="edge" d="M340 144 V88" marker-end="url(#arrow-in)"/>
          <text class="label" x="332" y="120" text-anchor="end">reads</text>
          <path class="edge" d="M380 88 V144" marker-end="url(#arrow-in)"/>
          <text class="label" x="388" y="120" text-anchor="start">publishes</text>
          <path class="edge" d="M450 176 H520" marker-end="url(#arrow-in)"/>
          <text class="label" x="485" y="167" text-anchor="middle">live</text>
          <path class="edge" d="M450 296 H520" marker-end="url(#arrow-in)"/>
          <text class="label" x="485" y="287" text-anchor="middle">every 5 min</text>
          <path class="edge" d="M700 296 H770" marker-end="url(#arrow-in)"/>
          <text class="label" x="735" y="287" text-anchor="middle">appends</text>
          <path class="edge" d="M860 264 V208" marker-end="url(#arrow-in)"/>
          <text class="label" x="870" y="240" text-anchor="start">new columns?</text>
          <path class="edge" d="M950 176 H1020" marker-end="url(#arrow-in)"/>
          <text class="label" x="985" y="167" text-anchor="middle">proposes</text>
          <path class="edge" d="M950 296 H1020" marker-end="url(#arrow-in)"/>
          <text class="label" x="985" y="287" text-anchor="middle">rolls up</text>
          <path class="edge" d="M1110 328 V384" marker-end="url(#arrow-in)"/>
          <text class="label" x="1120" y="360" text-anchor="start">gold tables</text>
          <path class="edge" d="M860 328 V416 H1020" marker-end="url(#arrow-in)"/>
          <text class="label" x="940" y="407" text-anchor="middle">raw tables</text>
          <!-- boxes -->
          <rect class="box" x="20" y="144" width="180" height="64" rx="8"/>
          <text class="title" x="110" y="171" text-anchor="middle">Your producers</text>
          <text class="sub" x="110" y="191" text-anchor="middle">write to Kafka</text>
          <rect class="box" x="20" y="264" width="180" height="64" rx="8"/>
          <text class="title" x="110" y="291" text-anchor="middle">Live feeds</text>
          <text class="sub" x="110" y="311" text-anchor="middle">ingest · e.g. SSE</text>
          <rect class="box" x="270" y="144" width="180" height="184" rx="8"/>
          <text class="title" x="360" y="231" text-anchor="middle">Kafka</text>
          <text class="sub" x="360" y="251" text-anchor="middle">a topic per dataset</text>
          <rect class="box rt" x="270" y="24" width="180" height="64" rx="8"/>
          <text class="title" x="360" y="51" text-anchor="middle">Processors</text>
          <text class="sub" x="360" y="71" text-anchor="middle">a dataset from a stream</text>
          <rect class="box rt" x="520" y="144" width="180" height="64" rx="8"/>
          <text class="title" x="610" y="171" text-anchor="middle">Pinot</text>
          <text class="sub" x="610" y="191" text-anchor="middle">real-time · 7 days</text>
          <rect class="box hist" x="520" y="264" width="180" height="64" rx="8"/>
          <text class="title" x="610" y="291" text-anchor="middle">Flush</text>
          <text class="sub" x="610" y="311" text-anchor="middle">exactly once · event time</text>
          <rect class="box hist" x="770" y="264" width="180" height="64" rx="8"/>
          <text class="title" x="860" y="291" text-anchor="middle">Iceberg</text>
          <text class="sub" x="860" y="311" text-anchor="middle">all history (Trino)</text>
          <rect class="box ai" x="770" y="144" width="180" height="64" rx="8"/>
          <text class="title" x="860" y="171" text-anchor="middle">Drift agent</text>
          <text class="sub" x="860" y="191" text-anchor="middle">Claude</text>
          <rect class="box" x="1020" y="144" width="180" height="64" rx="8"/>
          <text class="title" x="1110" y="171" text-anchor="middle">Config patch</text>
          <text class="sub" x="1110" y="191" text-anchor="middle">you review, git apply</text>
          <rect class="box hist" x="1020" y="264" width="180" height="64" rx="8"/>
          <text class="title" x="1110" y="291" text-anchor="middle">Rollups</text>
          <text class="sub" x="1110" y="311" text-anchor="middle">gold tables, gated</text>
          <rect class="box hist" x="1020" y="384" width="180" height="64" rx="8"/>
          <text class="title" x="1110" y="411" text-anchor="middle">Steps</text>
          <text class="sub" x="1110" y="431" text-anchor="middle">SQL or Python, gated</text>
  </g>
</svg>

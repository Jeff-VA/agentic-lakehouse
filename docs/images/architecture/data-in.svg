<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 384" width="1152" height="384" role="img" aria-label="Events flow from producers into Kafka. Pinot ingests them live; a flush job appends them to Iceberg every 5 minutes. From Iceberg, rollups build quality-gated gold tables and the drift agent proposes config patches for new columns.">
  <title>Events flow from producers into Kafka. Pinot ingests them live; a flush job appends them to Iceberg every 5 minutes. From Iceberg, rollups build quality-gated gold tables and the drift agent proposes config patches for new columns.</title>
  <style>
  svg {
    --fg: #17202a; --muted: #5a6572; --line: #c3cbd4; --surface: #ffffff;
    --rt: #c05f10; --rt-soft: #fdf0e4; --hist: #2461a6; --hist-soft: #e7eff9;
    --ai: #7550c0; --ai-soft: #f0ebfa; --both: #0d7a6b;
    color: var(--fg);
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --fg: #e5eaef; --muted: #95a1ad; --line: #3a4552; --surface: #161d24;
      --rt: #f09650; --rt-soft: #2b1f15; --hist: #6ba6ea; --hist-soft: #15212e;
      --ai: #b195f0; --ai-soft: #221b32; --both: #4fc4b1;
    }
  }
  .card { fill: var(--surface); stroke: var(--line); }
  .box { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
  .box.rt { fill: var(--rt-soft); stroke: var(--rt); }
  .box.hist { fill: var(--hist-soft); stroke: var(--hist); }
  .box.ai { fill: var(--ai-soft); stroke: var(--ai); }
  .title { fill: var(--fg); font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  .title.file { font: 400 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .sub, .label { fill: var(--muted); font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  .item, .query { fill: var(--fg); font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  .edge { stroke: currentColor; stroke-width: 1.5; fill: none; }
  .divider { stroke: var(--line); stroke-width: 1; }
  .bar.rt { fill: var(--rt-soft); stroke: var(--rt); }
  .bar.hist { fill: var(--hist-soft); stroke: var(--hist); }
  .bar-text { fill: var(--fg); font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  .tick { stroke: var(--muted); stroke-width: 1; }
  .range { stroke-width: 2; fill: none; }
  .range.rt { stroke: var(--rt); } .range.hist { stroke: var(--hist); } .range.both { stroke: var(--both); }
  .dot-both { fill: var(--both); }
  </style>
  <rect class="card" x="0.5" y="0.5" width="1151" height="383" rx="12"/>
  <g transform="translate(16 16)">
          <defs>
            <marker id="arrow-in" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
            </marker>
          </defs>
          <!-- edges -->
          <line class="edge" x1="180" y1="176" x2="250" y2="176" marker-end="url(#arrow-in)"/>
          <text class="label" x="215" y="167" text-anchor="middle">events</text>
          <path class="edge" d="M330 144 V56 H480" marker-end="url(#arrow-in)"/>
          <text class="label" x="405" y="47" text-anchor="middle">ingests live</text>
          <path class="edge" d="M330 208 V296 H480" marker-end="url(#arrow-in)"/>
          <text class="label" x="405" y="287" text-anchor="middle">every 5 min</text>
          <line class="edge" x1="640" y1="296" x2="710" y2="296" marker-end="url(#arrow-in)"/>
          <text class="label" x="675" y="287" text-anchor="middle">appends</text>
          <line class="edge" x1="790" y1="264" x2="790" y2="208" marker-end="url(#arrow-in)"/>
          <text class="label" x="800" y="240">new columns?</text>
          <line class="edge" x1="870" y1="176" x2="940" y2="176" marker-end="url(#arrow-in)"/>
          <text class="label" x="905" y="167" text-anchor="middle">proposes</text>
          <line class="edge" x1="870" y1="296" x2="940" y2="296" marker-end="url(#arrow-in)"/>
          <text class="label" x="905" y="287" text-anchor="middle">rolls up</text>
          <!-- boxes -->
          <rect class="box" x="20" y="144" width="160" height="64" rx="8"/>
          <text class="title" x="100" y="171" text-anchor="middle">Your producers</text>
          <text class="sub" x="100" y="191" text-anchor="middle">or run.py stream</text>
          <rect class="box" x="250" y="144" width="160" height="64" rx="8"/>
          <text class="title" x="330" y="171" text-anchor="middle">Kafka</text>
          <text class="sub" x="330" y="191" text-anchor="middle">a topic per dataset</text>
          <rect class="box rt" x="480" y="24" width="160" height="64" rx="8"/>
          <text class="title" x="560" y="51" text-anchor="middle">Pinot</text>
          <text class="sub" x="560" y="71" text-anchor="middle">real-time · 7 days</text>
          <rect class="box hist" x="480" y="264" width="160" height="64" rx="8"/>
          <text class="title" x="560" y="291" text-anchor="middle">Flush</text>
          <text class="sub" x="560" y="311" text-anchor="middle">Prefect · exactly once</text>
          <rect class="box hist" x="710" y="264" width="160" height="64" rx="8"/>
          <text class="title" x="790" y="291" text-anchor="middle">Iceberg</text>
          <text class="sub" x="790" y="311" text-anchor="middle">all history (Trino)</text>
          <rect class="box ai" x="710" y="144" width="160" height="64" rx="8"/>
          <text class="title" x="790" y="171" text-anchor="middle">Drift agent</text>
          <text class="sub" x="790" y="191" text-anchor="middle">Claude</text>
          <rect class="box" x="940" y="144" width="160" height="64" rx="8"/>
          <text class="title" x="1020" y="171" text-anchor="middle">Config patch</text>
          <text class="sub" x="1020" y="191" text-anchor="middle">you review, git apply</text>
          <rect class="box hist" x="940" y="264" width="160" height="64" rx="8"/>
          <text class="title" x="1020" y="291" text-anchor="middle">Rollups</text>
          <text class="sub" x="1020" y="311" text-anchor="middle">gold tables, gated</text>
  </g>
</svg>

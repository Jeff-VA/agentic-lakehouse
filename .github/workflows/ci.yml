# Unit tests and the app image on every push and pull request. The integration
# tests (pytest -m integration) need the Docker stack, so they run locally.
name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest  # the runner has Chrome, so the dashboard browser tests run too
      - run: python run.py check  # the project's config, views and dashboards

  app-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag male-app .

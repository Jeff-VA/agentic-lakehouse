[project]
name = "modular-agentic-lakehouse-engine"
version = "0.1.0"
description = "Config-driven semantic lakehouse engine: one ontology, many query engines."
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.6",
    "duckdb>=1.5",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "mcp>=2.3,<3",  # 2.x renamed FastMCP to MCPServer; core.api_gateway uses the 2.x API
    "prefect>=3.8,<4",  # match the server image in docker/docker-compose.yml
    "pyarrow>=18",
    "pydantic>=2.7",
    "pyiceberg[pyarrow,pyiceberg-core]>=0.10",  # pyiceberg-core: writes to partitioned tables
    "pyyaml>=6.0",
    "sqlglot>=30.21,<31",  # majors break dialect internals; core.compiler subclasses Dialect
    "trino>=0.330",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "pipelines"]

[tool.setuptools.package-data]
core = ["templates/*.sql", "templates/macros/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests need the Docker stack; run them with `pytest -m integration`.
addopts = "-m 'not integration'"
markers = ["integration: needs the local Docker stack (docker/docker-compose.yml), set up and seeded"]

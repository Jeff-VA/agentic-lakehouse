[project]
name = "modular-agentic-lakehouse-engine"
version = "0.1.0"
description = "Config-driven semantic lakehouse engine: one ontology, many query engines."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "sqlglot>=30.21,<31",  # majors break dialect internals; core.compiler subclasses Dialect
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core"]

[tool.setuptools.package-data]
core = ["templates/*.sql", "templates/macros/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

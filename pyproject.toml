[project]
name = "agentic-lakehouse"
version = "0.3.3"
description = "An AI-first lakehouse: metrics defined once over Kafka, Pinot and Iceberg, served live to dashboards and AI agents."
readme = "README.md"
license = "LicenseRef-All-Rights-Reserved"  # see LICENSE: public to read, no rights granted
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["lakehouse", "semantic layer", "iceberg", "pinot", "trino", "kafka", "mcp", "dashboards"]
dependencies = [
    "anthropic>=1.11,<2",
    "confluent-kafka>=2.6",
    "duckdb>=1.5",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "mcp>=2.3,<3",  # 2.x renamed FastMCP to MCPServer; agentic_lakehouse.api_gateway uses the 2.x API
    "prefect>=3.8,<4",  # match the server image in docker/docker-compose.yml
    "pyarrow>=18",
    "pydantic>=2.7",
    "pyiceberg[pyarrow,pyiceberg-core]>=0.10",  # pyiceberg-core: writes to partitioned tables
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",  # round-trip YAML edits that keep comments (agentic_lakehouse/agent_sync.py)
    "sqlglot>=30.21,<31",  # majors break dialect internals; agentic_lakehouse.compiler subclasses Dialect
    "trino>=0.330",
    "uvicorn>=0.30",
    "websockets>=13",  # drives headless Chrome for dashboard screenshots (agentic_lakehouse/browser.py)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agentic-lakehouse = "agentic_lakehouse.cli:main"

[project.urls]
Homepage = "https://github.com/Jeff-VA/agentic-lakehouse"
Documentation = "https://github.com/Jeff-VA/agentic-lakehouse#readme"

[build-system]
requires = ["setuptools>=77"]  # SPDX license expressions
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentic_lakehouse*"]  # examples/ is a project that uses the package, not part of it

[tool.setuptools.package-data]
agentic_lakehouse = ["templates/*.sql", "templates/macros/*.sql", "static/*", "project_template/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # examples/: project code, imported the way a project's own code is
# Integration tests need the Docker stack; run them with `pytest -m integration`.
addopts = "-m 'not integration'"
faulthandler_timeout = 120  # a hung test dumps every thread's stack
markers = ["integration: needs the local Docker stack (docker/docker-compose.yml), set up and seeded"]
